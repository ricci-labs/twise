<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conta já usada</title>
<link rel="stylesheet" href="../../twise.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width:390px;height:1100px" class="app ent acc-form"><div class="ent-scroll"><header class="ent-top"><button class="icon-btn" type="button" aria-label="Cancelar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><h1>Editar meta</h1></header><p class="req-hint"><b aria-hidden="true">*</b> obrigatório</p><form class="ent-form" novalidate><div class="fn-alert fn-alert--info" role="note" style="margin:0"><svg class="icon ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="ti__f" stroke="none"><circle cx="12" cy="12" r="9"/></g><circle cx="12" cy="12" r="9"/><path d="M12 11.2v5.2M12 7.8h.01"/></svg><div class="fn-alert__body"><p>O progresso é o saldo da conta escolhida. Use uma conta só para esta meta.</p></div></div><div class="fn-field" style="position:relative"><label class="fn-field__label" for="nome">Nome da meta <b aria-hidden="true">*</b></label><div class="fn-input"><input id="nome" placeholder="Ex.: Viagem de férias" value="Viagem para o Chile"></div></div><div class="fn-field"><label class="fn-field__label" for="valor">Valor da meta <b aria-hidden="true">*</b></label><div class="fn-input money-in ent-money"><span class="money-in__cur">R$</span><input id="valor" inputmode="decimal" placeholder="0,00" value="15.000,00"></div></div><div class="fn-field"><span class="fn-field__label">Guardado em <b aria-hidden="true">*</b></span><button class="pick pick--error" type="button" aria-haspopup="dialog"><img src="../../../assets/ilustracoes/soltas/moeda.svg" alt=""><span class="grow">Investimento<small>Saldo de hoje: R$ 8.000,00</small></span><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div class="fn-field__error"><svg class="icon ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="ti__f" stroke="none"><circle cx="12" cy="12" r="9"/></g><circle cx="12" cy="12" r="9"/><path d="M12 7.6v5.1M12 16.3h.01"/></svg>Essa conta já é de outra meta.</div></div><div class="fn-field"><span class="fn-field__label">Até quando</span><button class="sel sel--date" type="button" aria-haspopup="dialog"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="grow">31/07/2027</span><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><div class="pv" role="status"><img class="pv__art" src="../../../assets/ilustracoes/soltas/calendario.svg" alt=""><div class="pv__b"><p class="pv__h">Para chegar em jul/27</p><p class="gl-plan"><b>R$&nbsp;1.134,00 por mês</b>, contando com os <span class="nw">R$&nbsp;4.800,00</span> que já estão na Conta Viagem.</p></div></div><div class="sw-row sw-row--off"><label class="sw-l" for="sw-a-reserva-de-emerg-ncia"><span>É a reserva de emergência</span><p class="fn-field__help" style="margin:0">Já existe uma: a da Poupança. Só pode haver uma.</p></label><button id="sw-a-reserva-de-emerg-ncia" class="switch" aria-disabled="true" role="switch" aria-checked="false" type="button"><i></i></button></div></form></div><div class="ent-foot ent-foot--one"><button class="fn-btn fn-btn--primary" type="submit">Salvar</button></div></div>
</body>
</html>
