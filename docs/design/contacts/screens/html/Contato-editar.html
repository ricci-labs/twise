<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar contato</title>
<link rel="stylesheet" href="../../twise.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width:390px;height:1100px" class="app ent acc-form"><div class="ent-scroll"><header class="ent-top"><button class="icon-btn" type="button" aria-label="Cancelar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><h1>Editar contato</h1></header><p class="req-hint"><b aria-hidden="true">*</b> obrigatório</p><form class="ent-form" novalidate><div class="fn-field" style="position:relative"><label class="fn-field__label" for="nome">Nome <b aria-hidden="true">*</b></label><div class="fn-input"><input id="nome" placeholder="Ex.: Maria, Tio João" value="Member D"></div></div><div class="fn-field"><label class="fn-field__label" for="wa">WhatsApp</label><p class="fn-field__help" style="margin:0">Para enviar cobranças pelo WhatsApp.</p><div class="ct-phone"><button class="sel ct-ddi" type="button" aria-label="País">+55<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div class="fn-input fn-input--phone"><input id="wa" inputmode="tel" value="(11) 99999-0004" placeholder="(11) 99999-0000"></div></div></div><div class="fn-field" style="position:relative"><label class="fn-field__label" for="mail">E-mail</label><p class="fn-field__help" style="margin:0">Para enviar cobranças por e-mail.</p><div class="fn-input"><input id="mail" placeholder="nome@exemplo.com" value="member.d@exemplo.com"></div></div><div class="fn-field" style="position:relative"><label class="fn-field__label" for="pix">Chave Pix</label><p class="fn-field__help" style="margin:0">Para vocês pagarem este contato, quando precisarem.</p><div class="fn-input"><input id="pix" placeholder="CPF, e-mail, telefone ou aleatória" value="member.d@exemplo.com"></div></div><div class="fn-field"><label class="fn-field__label" for="obs">Observações</label><div class="fn-input ta"><textarea id="obs" rows="2" placeholder="">Divide a TV da sala e o mercado do mês.</textarea></div><div class="fn-field__counter">39/500</div></div><div class="sw-row"><label class="sw-l" for="sw-n-o-quer-receber-mensagens"><span>Não quer receber mensagens</span><p class="fn-field__help" style="margin:0">Quando ligado, o app avisa antes de enviar uma cobrança.</p></label><button id="sw-n-o-quer-receber-mensagens" class="switch" role="switch" aria-checked="false" type="button"><i></i></button></div></form></div><div class="ent-foot ent-foot--one"><button class="fn-btn fn-btn--primary" type="submit" aria-disabled="true">Salvar</button></div></div>
</body>
</html>
