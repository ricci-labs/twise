<body>
<div style="width:390px;height:844px" class="app ent"><div class="ent-scroll"><header class="ent-top"><button class="icon-btn" type="button" aria-label="Cancelar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><h1>Novo lançamento</h1></header><div class="ent-types" role="radiogroup" aria-label="Tipo de lançamento"><button class="tchip" role="radio" aria-checked="true" type="button">Despesa</button><button class="tchip" role="radio" aria-checked="false" type="button">Compra no cartão</button><button class="tchip" role="radio" aria-checked="false" type="button">Receita</button><button class="tchip" role="radio" aria-checked="false" type="button">Transferência</button><button class="tchip tchip--more" role="radio" aria-checked="false" type="button" aria-haspopup="dialog">Mais<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><p class="req-hint"><b aria-hidden="true">*</b> obrigatório</p><form class="ent-form" novalidate><div class="fn-field"><label class="fn-field__label" for="valor">Valor <b aria-hidden="true">*</b></label><div class="fn-input money-in ent-money"><span class="money-in__cur">R$</span><input id="valor" inputmode="decimal" placeholder="0,00" value="86,40"></div></div><div class="fn-field" style="position:relative"><label class="fn-field__label" for="desc">Descrição <b aria-hidden="true">*</b></label><div class="fn-input"><input id="desc" placeholder="Ex.: Mercado da semana" value="Mercado da semana"></div></div><div class="fn-field"><span class="fn-field__label">Pago com <b aria-hidden="true">*</b></span><button class="pick" type="button" aria-haspopup="dialog"><img src="../../../assets/ilustracoes/soltas/carteira.svg" alt=""><span class="grow">Conta X<small>Saldo de hoje: R$ 4.200,00</small></span><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><div class="fn-field"><span class="fn-field__label">Categoria <b aria-hidden="true">*</b></span><button class="pick" type="button" aria-haspopup="dialog"><img src="../../../assets/ilustracoes/soltas/mercado.svg" alt=""><span class="grow">Mercado</span><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><div class="fn-field"><span class="fn-field__label">Data <b aria-hidden="true">*</b></span><div class="dchips" role="radiogroup" aria-label="Data"><button class="dchip" role="radio" aria-checked="true" type="button">Hoje, 20 out</button><button class="dchip" role="radio" aria-checked="false" type="button">Ontem</button><button class="dchip" role="radio" aria-checked="false" type="button"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Outra data</button></div></div><div class="fn-field"><label class="fn-field__label">Forma de pagamento</label><button class="sel" type="button" aria-haspopup="listbox"><span class="grow">Pix</span><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><div class="fn-field"><span class="fn-field__label">Quem gastou</span><div class="who" role="radiogroup" aria-label="Quem gastou"><button class="who__b" role="radio" aria-checked="true" type="button"><span class="avatar">A</span>Member A</button><button class="who__b" role="radio" aria-checked="false" type="button"><span class="avatar">B</span>Member B</button></div></div><div class="fn-field"><span class="fn-field__label">Dividir com contatos</span><button class="add-row" type="button"><svg class="icon-sm ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="ti__f" stroke="none"></g><path d="M12 5v14M5 12h14"/></svg>Dividir com contatos</button></div><div class="fn-field"><label class="fn-field__label" for="obs">Observações</label><div class="fn-input ta"><textarea id="obs" rows="2" placeholder=""></textarea></div><div class="fn-field__counter">0/2000</div></div></form></div><div class="ent-foot"><button class="fn-btn fn-btn--primary" type="submit">Salvar lançamento</button><button class="fn-btn fn-btn--tertiary ent-foot__2" type="button">Salvar e registrar outro</button></div><div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Pago com">
<div class="sheet__handle"></div>
