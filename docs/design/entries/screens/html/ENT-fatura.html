<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagamento de fatura</title>
<link rel="stylesheet" href="../../twise.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width:390px;height:844px" class="app ent"><div class="ent-scroll"><header class="ent-top"><button class="icon-btn" type="button" aria-label="Cancelar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><h1>Novo lançamento</h1></header><div class="ent-types" role="radiogroup" aria-label="Tipo de lançamento"><button class="tchip" role="radio" aria-checked="false" type="button">Despesa</button><button class="tchip" role="radio" aria-checked="false" type="button">Compra no cartão</button><button class="tchip" role="radio" aria-checked="false" type="button">Receita</button><button class="tchip" role="radio" aria-checked="false" type="button">Transferência</button><button class="tchip tchip--more" role="radio" aria-checked="true" type="button" aria-haspopup="dialog">Pagamento de fatura<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><p class="req-hint"><b aria-hidden="true">*</b> obrigatório</p><form class="ent-form" novalidate><div class="fn-field"><label class="fn-field__label" for="valor">Valor <b aria-hidden="true">*</b></label><div class="fn-input money-in ent-money"><span class="money-in__cur">R$</span><input id="valor" inputmode="decimal" placeholder="0,00" value="2.000,00"></div><div class="f-warn"><svg class="icon ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="ti__f" stroke="none"><path d="M10.3 4.3 2.9 17.4a2 2 0 0 0 1.7 3h14.8a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/></g><path d="M10.3 4.3 2.9 17.4a2 2 0 0 0 1.7 3h14.8a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/><path d="M12 9.3v4.2M12 16.8h.01"/></svg>O valor é maior que o saldo da fatura.</div></div><div class="fn-field"><span class="fn-field__label">Cartão <b aria-hidden="true">*</b></span><button class="pick" type="button" aria-haspopup="dialog"><img src="../../../assets/ilustracoes/soltas/cartao.svg" alt=""><span class="grow">Cartão X<small>Fecha 25/10 · vence 04/11</small></span><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><div class="fn-field"><span class="fn-field__label">Fatura <b aria-hidden="true">*</b></span><div class="invs" role="radiogroup" aria-label="Fatura">
<button class="invr" role="radio" aria-checked="true" type="button"><span class="radio"></span><span class="grow">Vence 04/11<small>Falta pagar <b>R$ 1.950,00</b></small></span><span class="fn-badge fn-badge--pending">Aberta</span></button>
<button class="invr" role="radio" aria-checked="false" type="button"><span class="radio"></span><span class="grow">Vence 04/12<small>Falta pagar <b>R$ 640,00</b></small></span><span class="fn-badge fn-badge--neutral">Futura</span></button></div></div><div class="fn-field"><span class="fn-field__label">Pago com <b aria-hidden="true">*</b></span><button class="pick" type="button" aria-haspopup="dialog"><img src="../../../assets/ilustracoes/soltas/carteira.svg" alt=""><span class="grow">Conta X<small>Conta padrão do cartão</small></span><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><div class="fn-field" style="position:relative"><label class="fn-field__label" for="desc">Descrição <b aria-hidden="true">*</b></label><div class="fn-input"><input id="desc" placeholder="" value="Fatura Cartão X · vence 04/11"></div></div><div class="fn-field"><span class="fn-field__label">Data <b aria-hidden="true">*</b></span><div class="dchips" role="radiogroup" aria-label="Data"><button class="dchip" role="radio" aria-checked="true" type="button">Hoje, 20 out</button><button class="dchip" role="radio" aria-checked="false" type="button">Ontem</button><button class="dchip" role="radio" aria-checked="false" type="button"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Outra data</button></div></div><div class="fn-field"><label class="fn-field__label" for="obs">Observações</label><div class="fn-input ta"><textarea id="obs" rows="2" placeholder=""></textarea></div><div class="fn-field__counter">0/2000</div></div></form></div><div class="ent-foot"><button class="fn-btn fn-btn--primary" type="submit">Salvar lançamento</button><button class="fn-btn fn-btn--tertiary ent-foot__2" type="button">Salvar e registrar outro</button></div></div>
</body>
</html>
