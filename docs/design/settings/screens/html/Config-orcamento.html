<body>
<div style="width:390px;height:844px" class="app ent acc-form"><div class="ent-scroll"><div class="app-top">

</div><div class="sub-head ed-head"><a class="icon-btn sub-top__back" href="#" aria-label="Voltar para Configurações"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><div><h1>Orçamento</h1></div></div><form class="ent-form st-form" novalidate><div class="fn-field"><span class="fn-field__label">O orçamento considera</span><p class="fn-field__help" style="margin:0">Comissões variam; contar com elas no orçamento pode deixar o mês apertado.</p><div class="pl-opts" role="radiogroup" aria-label="O orçamento considera"><button class="pl-opt" role="radio" aria-checked="true" type="button"><span class="radio"></span><span class="pl-opt__b">Só a renda fixa <small class=st-rec>recomendado</small></span></button><button class="pl-opt" role="radio" aria-checked="false" type="button"><span class="radio"></span><span class="pl-opt__b">Toda a renda, incluindo comissões</span></button></div></div><div class="fn-field"><span class="fn-field__label">Compras parceladas contam</span><div class="pl-opts" role="radiogroup" aria-label="Compras parceladas contam"><button class="pl-opt" role="radio" aria-checked="true" type="button"><span class="radio"></span><span class="pl-opt__b">Em cada parcela, na fatura em que ela cai <small class=st-rec>recomendado</small></span></button><button class="pl-opt" role="radio" aria-checked="false" type="button"><span class="radio"></span><span class="pl-opt__b">Inteiras, no mês da compra</span></button></div></div></form></div><div class="ent-foot ent-foot--one"><button class="fn-btn fn-btn--primary" type="submit" aria-disabled="true">Salvar orçamento</button></div></div>
