<!doctype html>

<head>

<title>Já tem convite</title>
<link rel="stylesheet" href="../../twise.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width:390px;height:844px" class="app ent acc-form"><div class="ent-scroll"><div class="app-top">
<button class="ws-btn" type="button" aria-haspopup="dialog" aria-label="Espaço Casa. Trocar de espaço"><img src="../../../assets/logo/twise-icone.svg" alt="">Casa<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
<button class="avatars-btn" type="button" aria-label="Member A e Member B neste espaço"><span class="avatars"><span>A</span><span>B</span></span></button>
</div><div class="sub-head ed-head"><a class="icon-btn sub-top__back" href="#" aria-label="Voltar para Membros"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><div><h1>Convidar</h1></div></div><form class="ent-form st-form" novalidate><div class="fn-field"><span class="fn-field__label">Convidar por <b aria-hidden="true">*</b></span><div class="seg seg--full st-seg" role="radiogroup" aria-label="Convidar por"><button class="seg__b" role="radio" type="button" aria-checked="true" aria-selected="true">E-mail</button><button class="seg__b" role="radio" type="button" aria-checked="false" aria-selected="false">Telefone</button></div></div><div class="fn-field" style="position:relative"><label class="fn-field__label" for="ie">E-mail <b aria-hidden="true">*</b></label><p class="fn-field__help" style="margin:0">Só quem tem esse e-mail pode aceitar.</p><div class="fn-input fn-input--error"><input id="ie" placeholder="nome@exemplo.com" value="member.c@exemplo.com" aria-invalid="true"></div><div class="fn-field__error"><svg class="icon ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="ti__f" stroke="none"><circle cx="12" cy="12" r="9"/></g><circle cx="12" cy="12" r="9"/><path d="M12 7.6v5.1M12 16.3h.01"/></svg>Já existe um convite pendente para esse e-mail. Revogue o anterior para mandar outro.</div></div><div class="fn-field"><span class="fn-field__label">Papel <b aria-hidden="true">*</b></span><button class="pick" type="button" aria-haspopup="dialog"><img src="../../../assets/ilustracoes/soltas/juntos.svg" alt=""><span class="grow">Membro<small>Lança, edita e planeja</small></span><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><p class="fn-field__help" style="margin:0">O convite vale por 7 dias. Você pode revogar antes.</p></form></div><div class="ent-foot ent-foot--one"><button class="fn-btn fn-btn--primary" type="submit">Enviar convite</button></div></div>
