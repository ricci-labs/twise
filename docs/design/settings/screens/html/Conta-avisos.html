<body>
<div style="width:390px;height:844px" class="app ent acc-form"><div class="ent-scroll"><div class="app-top">
<button class="ws-btn" type="button" aria-haspopup="dialog" aria-label="Espaço Casa. Trocar de espaço"><img src="../../../assets/logo/twise-icone.svg" alt="">Casa<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
<button class="avatars-btn" type="button" aria-label="Member A e Member B neste espaço"><span class="avatars"><span>A</span><span>B</span></span></button>
</div><div class="sub-head ed-head"><a class="icon-btn sub-top__back" href="#" aria-label="Voltar para Minha conta"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><div><h1>Avisos do espaço Casa</h1></div></div><form class="ent-form st-form" novalidate><p class="ct-lead" style="margin:0">Valem só para o espaço Casa. Cada espaço tem os seus.</p><div class="fn-field"><span class="fn-field__label">Avisar contas e faturas com quantos dias de antecedência <b aria-hidden="true">*</b></span><div class="pl-every"><div class="stepper"><button type="button" aria-label="Menos">−</button><b>3 dias</b><button type="button" aria-label="Mais">+</button></div></div><p class="fn-field__help" style="margin:0">De 0 a 30. Com 0, o aviso chega só no dia do vencimento.</p></div><div class="pv" role="status"><img class="pv__art" src="../../../assets/ilustracoes/soltas/calendario.svg" alt=""><div class="pv__b"><p class="pv__h">Por exemplo</p><p class="gl-plan">A Internet vence em 18/11: o aviso chega em <b>15/11</b>, por e-mail, uma vez.</p></div></div></form></div><div class="ent-foot ent-foot--one"><button class="fn-btn fn-btn--primary" type="submit" aria-disabled="true">Salvar preferências</button></div></div>
</body>
